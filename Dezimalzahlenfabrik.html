<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiver Bruch-Trainer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ecf0f1;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 40px;
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .instruction {
            font-size: 14pt;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-style: italic;
        }

        .task-display {
            font-size: 3em;
            margin: 30px 0;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .solution-display {
            font-size: 2.2em;
            margin: 30px 0;
            padding: 20px;
            background-color: #e8f8f5;
            border: 2px dashed #1abc9c;
            border-radius: 8px;
            display: none; /* Wird erst beim Klick sichtbar */
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Darstellung echter Brüche */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 5px;
            font-weight: bold;
            color: #2c3e50;
        }

        .fraction .numerator {
            border-bottom: 3px solid #2c3e50;
            padding: 0 5px;
        }

        .fraction .denominator {
            padding: 0 5px;
        }

        /* Normale Gleichheitszeichen */
        .normal-eq {
            font-size: 1.5em;
            margin: 0 15px;
            color: #2c3e50;
            line-height: 1;
        }

        /* Erweitern / Kürzen am Gleichheitszeichen */
        .op-equals {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 15px;
            vertical-align: middle;
        }

        .op-equals .op {
            font-size: 0.35em;
            color: #e74c3c;
            font-weight: bold;
            line-height: 1;
        }

        .op-equals .eq {
            font-size: 1.5em;
            color: #2c3e50;
            line-height: 1;
            margin: 2px 0;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            font-size: 16pt;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-neu {
            background-color: #3498db;
            color: white;
        }

        .btn-neu:hover {
            background-color: #2980b9;
        }

        .btn-loesung {
            background-color: #f39c12;
            color: white;
        }

        .btn-loesung:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Die Übersetzer-Maschine</h1>
        <div class="instruction" id="instructionText">Wandle den Bruch um!</div>
        
        <!-- Hier erscheint die Aufgabe -->
        <div class="task-display" id="taskDisplay"></div>

        <!-- Hier erscheint die Lösung -->
        <div class="solution-display" id="solutionDisplay"></div>

        <!-- Steuerung -->
        <div class="btn-container">
            <button class="btn-neu" onclick="generateNew()">Neu</button>
            <button class="btn-loesung" onclick="showSolution()">Lösung zeigen</button>
        </div>
    </div>

    <script>
        // 1 = Hunderterbruch-Aufgabe, 2 = Gekürzter-Bruch-Aufgabe
        let currentTaskType = 2; 
        
        // Variablen für den aktuellen Bruch
        let currentHNumerator = 0; 
        let currentReducedN = 0;   
        let currentReducedD = 0;   

        // Erlaubte Nenner für Klasse 6 (Teiler von 100, ohne 1 und 100)
        const allowedDenominators = [2, 4, 5, 10, 20, 25, 50];

        // Hilfsfunktion: Größter gemeinsamer Teiler (ggT)
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        // Hilfsfunktion: Erzeugt das HTML für einen echten Bruch
        function createFractionHTML(n, d) {
            return `<div class="fraction"><div class="numerator">${n}</div><div class="denominator">${d}</div></div>`;
        }

        // Hilfsfunktion: Erzeugt das HTML für ein Gleichheitszeichen mit Rechenoperation
        function createOpEquals(operator, number) {
            if(number === 1) return `<span class="normal-eq">=</span>`;
            return `
            <div class="op-equals">
                <span class="op">${operator} ${number}</span>
                <span class="eq">=</span>
                <span class="op">${operator} ${number}</span>
            </div>`;
        }

        // Generiert eine neue Aufgabe im Wechsel
        function generateNew() {
            document.getElementById('solutionDisplay').style.display = 'none';

            // Wechselt den Aufgaben-Typ
            currentTaskType = currentTaskType === 1 ? 2 : 1;

            if (currentTaskType === 1) {
                // VARIANTE 1: Start mit Hunderterbruch
                currentHNumerator = Math.floor(Math.random() * 99) + 1; // 1 bis 99
                
                let g = gcd(currentHNumerator, 100);
                currentReducedN = currentHNumerator / g;
                currentReducedD = 100 / g;

                document.getElementById('taskDisplay').innerHTML = createFractionHTML(currentHNumerator, 100);
                document.getElementById('instructionText').innerHTML = "Schreibe als Dezimalzahl und kürze vollständig!";
            
            } else {
                // VARIANTE 2: Start mit gekürztem Bruch
                let dIdx = Math.floor(Math.random() * allowedDenominators.length);
                currentReducedD = allowedDenominators[dIdx];

                // Finde alle Zähler, die vollständig gekürzt sind
                let validNumerators = [];
                for (let i = 1; i < currentReducedD; i++) {
                    if (gcd(i, currentReducedD) === 1) {
                        validNumerators.push(i);
                    }
                }
                
                let nIdx = Math.floor(Math.random() * validNumerators.length);
                currentReducedN = validNumerators[nIdx];

                let erweiterungsZahl = 100 / currentReducedD;
                currentHNumerator = currentReducedN * erweiterungsZahl;

                document.getElementById('taskDisplay').innerHTML = createFractionHTML(currentReducedN, currentReducedD);
                document.getElementById('instructionText').innerHTML = "Erweitere auf 100 und schreibe als Dezimalzahl!";
            }
        }

        // Zeigt die formatierte Lösung an
        function showSolution() {
            // padStart erzwingt eine zweistellige Zahl (z.B. aus 5 wird 05 -> "0,05")
            let decimalStr = "0," + currentHNumerator.toString().padStart(2, '0');
            
            let hunderterHTML = createFractionHTML(currentHNumerator, 100);
            let gekuerztHTML = createFractionHTML(currentReducedN, currentReducedD);
            let normalEq = `<span class="normal-eq">=</span>`;
            
            let solHTML = "";

            if (currentTaskType === 1) {
                // Reihenfolge laut Vorgabe 1: Hunderterbruch = Dezimalbruch = gekürzter Bruch
                let g = gcd(currentHNumerator, 100);
                let opEq = createOpEquals(':', g); // Divisionszeichen für das Kürzen

                solHTML = `${hunderterHTML} ${normalEq} ${decimalStr} ${opEq} ${gekuerztHTML}`;
            } else {
                // Reihenfolge laut Vorgabe 2: gekürzter Bruch = Hunderterbruch = Dezimalzahl
                let factor = 100 / currentReducedD;
                let opEq = createOpEquals('&middot;', factor); // Malzeichen für das Erweitern

                solHTML = `${gekuerztHTML} ${opEq} ${hunderterHTML} ${normalEq} ${decimalStr}`;
            }
            
            let solutionDiv = document.getElementById('solutionDisplay');
            solutionDiv.innerHTML = solHTML;
            solutionDiv.style.display = 'flex';
        }

        // Beim ersten Laden der Seite starten
        window.onload = generateNew;
    </script>
</body>
</html>
